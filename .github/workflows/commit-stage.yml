name: Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  commit-and-acceptance:
    name: Commit and acceptance stages
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        run: make install

      # Lint, unit and component tests, then build the images once (tagged with the commit SHA).
      - name: Commit stage
        run: make commit-stage

      # Runs the acceptance tests against those same images.
      - name: Acceptance stage
        run: make acceptance
